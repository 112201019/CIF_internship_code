<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <title>CIF</title>
    <link rel="stylesheet" href="css/style.css" />
    <script src="js/script.js"></script>
    <script src="js/main.js"></script>
</head>

<body>
    <nav class="navbar">
        <div class="logo">CIF STAFF PORTAL</div>
        <div class="user-menu">
            <h3 class="current-user">User:</h3>
            <div class="dropdown-content">
                <button onclick="show_current_user()">Profile</button>
                <button onclick="logout()">Logout</button>
            </div>
        </div>
    </nav>

    <div class="row">
        <div class="column card">
            <h3>Requests For Staff Role</h3>
            <button onclick="showPendingRequestsStaff()">
                Show Requests
            </button>
            <div id="showPendingStaff"></div>
        </div>

        <div class="column card">
            <h3>Add New Equipment Slot</h3>
            <p>Create new available slots for a piece of equipment.</p>

            <form id="insertSlotForm" class="form-container" style="padding: 0; box-shadow: none;">
                <div class="form-group">
                    <label for="equipmentId">Equipment ID:</label>
                    <input type="text" id="equipmentId" name="equipmentId" required placeholder="e.g., EQ001" />
                </div>

                <div class="form-group">
                    <label for="startTime">Start of Time Range:</label>
                    <input type="datetime-local" id="startTime" name="startTime" required />
                </div>

                <div class="form-group">
                    <label for="endTime">End of Time Range:</label>
                    <input type="datetime-local" id="endTime" name="endTime" required />
                </div>

                <button onclick="handleAddSlot(event)" type="submit" class="btn-primary">Create Slots</button>
            </form>

            <div id="responseMessage" style="margin-top: 15px"></div>
        </div>
    </div>
</body>
<script>
    document.addEventListener("DOMContentLoaded", function () {
        const token = getCookie();
        if (!token) {
            window.location.href = "login.html";
        }
        console.log("Token Test");
        show_current_user();
    });
</script>

</html>
