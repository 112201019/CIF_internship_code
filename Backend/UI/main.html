<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <title>CIF</title>
    <link rel="stylesheet" href="css/style.css" />
    <script src="js/script.js"></script>
</head>

<body>
    <nav class="navbar">
        <div class="logo">CIF</div>
        <div class="user-menu">
            <h3 class="current-user">User:</h3>
            <div class="dropdown-content">
                <button onclick="show_current_user()">Profile</button>
                <button onclick="logout()">Logout</button>
            </div>
        </div>
    </nav>

    <div style="padding: 20px;">
        <h1>Welcome to CIF</h1>
        <p>Use the following functionality to proceed with what you want.</p>
    </div>

    <div class="row">
        <div class="column card">
            <h3>Available Equipment</h3>
            <table id="equipmentTable" class="data-table">
                <thead>
                    <tr>
                        <th>Equipment Name</th>
                        <th>Book</th>
                    </tr>
                </thead>
                <tbody id="equipmentTableBody">
                </tbody>
            </table>
        </div>

        <div class="column card">
            <h3>Track Request</h3>
            <div class="track-request form-group">
                <input type="text" id="requestIdInput" placeholder="Enter Request ID" />
                <button onclick="trackRequest()">Track Request</button>
            </div>
            <div class="request-info hidden" id="requestInfo">
                <p>Request ID: <span id="reqId"></span></p>
                <p>Date: <span id="reqDate"></span></p>
                <p>Status: <span id="reqApproved"></span></p>
            </div>
        </div>

        <div class="column card">
            <h3>My Requests</h3>
            <button onclick="showRequestsAll()">Show All My Requests</button>
            <div id="requestInfo2" class="show-requests">
            </div>
        </div>
    </div>
</body>
<script>
    document.addEventListener("DOMContentLoaded", function () {
        const token = getCookie();
        if (!token) {
            window.location.href = "login.html";
        }
        checkUser();
        show_current_user();
        // UX Fix: Automatically load equipments
        fetchAndDisplayEquipments();
    });
</script>

</html>
