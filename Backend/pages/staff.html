<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CIF Staff Portal</title>
  
  <script src="script.js"></script>
  
  <style>
    /* --- GLOBAL RESET & FONTS --- */
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: #f0f2f5; color: #333; height: 100vh; display: flex; flex-direction: column; }
    
    /* --- NAVBAR (Purple Theme for Staff) --- */
    .navbar { background-color: #8e44ad; color: white; padding: 0 2rem; height: 60px; display: flex; justify-content: space-between; align-items: center; box-shadow: 0 2px 5px rgba(0,0,0,0.1); flex-shrink: 0; }
    .logo { font-size: 1.2rem; font-weight: bold; letter-spacing: 1px; }
    .user-menu { position: relative; cursor: pointer; font-weight: 600; }
    .user-menu:hover .dropdown-content { display: block; }
    .current-user { font-size: 16px; margin: 0; font-weight: 600; }
    .dropdown-content { display: none; position: absolute; right: 0; top: 100%; background-color: #fff; min-width: 150px; box-shadow: 0 8px 16px rgba(0,0,0,0.1); border-radius: 4px; overflow: hidden; z-index: 100; }
    .dropdown-content button { width: 100%; padding: 12px 16px; text-align: left; border: none; background: none; cursor: pointer; font-size: 14px; color: #333; transition: background 0.2s; }
    .dropdown-content button:hover { background-color: #f1f1f1; }

    /* --- MAIN LAYOUT --- */
    .container { display: flex; flex: 1; overflow: hidden; }
    
    /* --- SIDEBAR --- */
    .sidebar { width: 260px; background: white; border-right: 1px solid #e0e0e0; padding: 1.5rem; display: flex; flex-direction: column; gap: 10px; flex-shrink: 0; }
    .menu-btn { width: 100%; padding: 12px 15px; text-align: left; background: none; border: none; border-radius: 6px; cursor: pointer; color: #555; font-size: 15px; font-weight: 500; transition: all 0.2s; }
    .menu-btn:hover { background-color: #f5eef8; color: #8e44ad; }
    .menu-btn.active { background-color: #8e44ad; color: white; font-weight: 600; box-shadow: 0 2px 5px rgba(142, 68, 173, 0.3); }
    .divider { border: 0; border-top: 1px solid #eee; margin: 5px 0; }

    /* --- CONTENT AREA --- */
    .main-content { flex: 1; padding: 2rem; overflow-y: auto; }

    /* --- FORMS & CONTAINERS --- */
    .form-container { background: white; padding: 30px; border-radius: 8px; box-shadow: 0 4px 15px rgba(0,0,0,0.05); max-width: 1000px; margin: 0 auto; }
    .form-container h2 { margin-bottom: 5px; color: #2c3e50; border-bottom: 2px solid #eee; padding-bottom: 10px; }
    .form-group { margin-bottom: 15px; }
    .form-group label { display: block; margin-bottom: 5px; font-weight: 600; color: #555; }
    .form-group input, .form-group select { width: 100%; padding: 10px; border: 1px solid #ddd; border-radius: 4px; font-size: 14px; }
    
    /* --- BUTTONS --- */
    .action-btn { background: #27ae60; color: white; border: none; padding: 10px 20px; border-radius: 4px; cursor: pointer; font-weight: 600; transition: 0.2s; }
    .action-btn:hover { opacity: 0.9; }
    .note { color: #7f8c8d; font-size: 14px; margin-bottom: 20px; }

    /* --- REQUEST ITEMS --- */
    .request-list { max-height: 600px; overflow-y: auto; padding-right: 5px; }
    .request-item { background: #f9f9f9; border: 1px solid #e0e0e0; border-radius: 6px; padding: 15px; margin-bottom: 15px; position: relative; }
    
    /* Modals */
    .modal { display: none; position: fixed; z-index: 1000; left: 0; top: 0; width: 100%; height: 100%; overflow: auto; background-color: rgba(0,0,0,0.5); }
    .modal-content { background-color: #fff; margin: 5% auto; padding: 30px; border-radius: 8px; width: 90%; max-width: 500px; }
  </style>
</head>

<body>
  <nav class="navbar">
    <div class="logo">CIF STAFF PORTAL</div>
    <div class="user-menu">
      <h3 class="current-user">User: ...</h3>
      <div class="dropdown-content">
        <button onclick="openProfileModal()">Profile</button>
        <button onclick="logout()">Logout</button>
      </div>
    </div>
  </nav>

  <div class="container">
    <aside class="sidebar">
        <button class="menu-btn active" data-section="staff_approvals" onclick="switchSectionStaff(this)">Staff Approvals</button>
        <hr class="divider">
        <button class="menu-btn" data-section="ongoing_experiments" onclick="switchSectionStaff(this)">Ongoing Experiments</button>
        <button class="menu-btn" data-section="manage_slots" onclick="switchSectionStaff(this)">Manage Slots</button>
    </aside>

    <main class="main-content">
        <div id="contentArea"></div>
    </main>
  </div>

  <div id="requestDetailsModal" class="modal" onclick="closeModalIfOutside(event)">
    <div class="modal-content" style="max-width: 650px; padding: 0; overflow: hidden; border-radius: 8px; box-shadow: 0 10px 30px rgba(0,0,0,0.2);">
      <div style="background: #2c3e50; color: white; padding: 20px; position: relative;">
        <span onclick="closeRequestModal()" style="position: absolute; right: 20px; top: 15px; font-size: 28px; cursor: pointer; color: #ecf0f1; line-height: 20px;">&times;</span>
        <h2 style="margin: 0; font-size: 20px; border:none; padding:0; color:white;">Request Details</h2>
      </div>
      <div id="requestModalBody" style="padding: 25px; max-height: 60vh; overflow-y: auto; font-size: 14px; color: #333; line-height: 1.6;"></div>
      <div id="requestModalActions" style="padding: 20px 25px; background: #f8f9fa; border-top: 1px solid #eee; display: flex; gap: 15px;"></div>
    </div>
  </div>

  <script>
    document.addEventListener("DOMContentLoaded", function () {
      const token = getCookie("session_token") || getCookie();
      if (!token) {
        window.location.href = "login.html";
        return;
      }
      if (typeof show_current_user === "function") show_current_user();

      // Automatically load the first section
      const defaultBtn = document.querySelector('.menu-btn[data-section="staff_approvals"]');
      if (defaultBtn) switchSectionStaff(defaultBtn);
    });
  </script>
</body>
</html>
