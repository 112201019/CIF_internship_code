<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Book Equipment | CIF Student Portal</title>
  
  <script src="book.js" defer></script>
  
  <style>
    /* --- GLOBAL RESET & FONTS --- */
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: #f0f2f5; color: #333; display: flex; flex-direction: column; min-height: 100vh; }
    
    /* --- NAVBAR --- */
    .navbar { background-color: #2980b9; color: white; padding: 0 2rem; height: 60px; display: flex; justify-content: space-between; align-items: center; box-shadow: 0 2px 5px rgba(0,0,0,0.1); }
    .logo { font-size: 1.2rem; font-weight: bold; letter-spacing: 1px; }
    .back-btn { background: none; border: 1px solid white; color: white; padding: 6px 15px; border-radius: 4px; cursor: pointer; font-size: 14px; text-decoration: none; transition: 0.2s; }
    .back-btn:hover { background: white; color: #2980b9; }

    /* --- MAIN CONTAINER --- */
    .container { max-width: 1000px; margin: 30px auto; padding: 0 20px; width: 100%; flex: 1; }
    
    .page-title { margin-bottom: 25px; color: #2c3e50; border-bottom: 3px solid #3498db; padding-bottom: 10px; display: inline-block; }

    /* --- SECTIONS --- */
    .section-card { background: white; padding: 25px; border-radius: 8px; box-shadow: 0 4px 15px rgba(0,0,0,0.05); margin-bottom: 25px; }
    .section-title { font-size: 1.1rem; color: #34495e; margin-bottom: 15px; display: flex; align-items: center; gap: 10px; }
    .section-title span { background: #3498db; color: white; width: 28px; height: 28px; display: flex; justify-content: center; align-items: center; border-radius: 50%; font-size: 14px; font-weight: bold; }

    /* --- GRID LAYOUTS --- */
    .grid-container { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 15px; }
    
    /* --- PROJECT CARDS --- */
    .project-card { border: 2px solid #e0e0e0; padding: 15px; border-radius: 8px; cursor: pointer; transition: all 0.2s; background: #fff; }
    .project-card:hover { border-color: #3498db; transform: translateY(-2px); box-shadow: 0 4px 10px rgba(0,0,0,0.08); }
    .project-card.selected-project { border-color: #27ae60; background-color: #f2fcf5; box-shadow: 0 4px 10px rgba(39, 174, 96, 0.15); }
    .project-card h4 { color: #2c3e50; margin-bottom: 8px; font-size: 16px; }
    .project-card p { font-size: 13px; color: #666; margin-bottom: 4px; }

    /* --- SLOT CARDS --- */
    .slot-card { border: 1px solid #ddd; padding: 15px; border-radius: 8px; background: #fafafa; display: flex; flex-direction: column; justify-content: space-between; }
    .slot-card h4 { color: #2980b9; margin-bottom: 10px; font-size: 15px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
    .slot-card p { font-size: 13px; margin-bottom: 8px; color: #444; }
    
    /* --- FORMS & INPUTS --- */
    .form-group { margin-bottom: 15px; }
    .form-group label { display: block; font-weight: 600; font-size: 13px; color: #555; margin-bottom: 5px; }
    .form-control { width: 100%; padding: 10px; border: 1px solid #ccd1d9; border-radius: 4px; font-size: 14px; transition: 0.2s; }
    .form-control:focus { border-color: #3498db; outline: none; }
    .checkbox-group { display: flex; align-items: center; gap: 8px; margin-bottom: 8px; background: #f8f9fa; padding: 10px; border-radius: 4px; border: 1px solid #eee; }
    .checkbox-group input { width: 16px; height: 16px; cursor: pointer; }

    /* --- BUTTONS --- */
    .btn { padding: 10px 20px; border: none; border-radius: 4px; font-weight: 600; cursor: pointer; transition: 0.2s; font-size: 14px; text-align: center; }
    .btn-primary { background: #3498db; color: white; }
    .btn-primary:hover { background: #2980b9; }
    .btn-success { background: #27ae60; color: white; width: 100%; margin-top: 10px; }
    .btn-success:hover { background: #219653; }
    .btn-disabled { background: #95a5a6; color: white; cursor: not-allowed; }
  </style>
</head>
<body>

  <nav class="navbar">
    <div class="logo">CIF BOOKING SYSTEM</div>
    <a href="main.html" class="back-btn">&larr; Back to Dashboard</a>
  </nav>

  <div class="container">
    <h2 class="page-title">Book Equipment: <span id="equipmentNameDisplay" style="color:#e67e22;">Loading...</span></h2>

    <div class="section-card">
      <h3 class="section-title"><span>1</span> Select Your Project</h3>
      <p style="font-size: 13px; color: #7f8c8d; margin-bottom: 15px;">Click on the project you want to deduct funds from for this experiment.</p>
      <div id="projectTable" class="grid-container">
        <p style="color:#777;">Loading active projects...</p>
      </div>
    </div>

    <div id="books">
        </div>

  </div>

  <script>
    document.addEventListener("DOMContentLoaded", () => {
      const equipName = getURLParameter("equipment");
      if(equipName) {
        document.getElementById("equipmentNameDisplay").textContent = equipName.toUpperCase();
      }
      fetchAndDisplayProjects();
      trackRequest();
    });
  </script>
</body>
</html>
