<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - CIF Portal</title>
    <link rel="stylesheet" href="css/style.css">
</head>

<body>
    <div class="login-wrapper">
        <div class="login-brand">
            <h1>CIF PORTAL</h1>
            <p>Central Instrumentation Facility</p>
        </div>
        <div class="login-form-container">
            <div class="login-form">
                <h2>Welcome Back</h2>
                <p>Please sign in to access your dashboard.</p>
                <form id="loginForm" class="form-container">
                    <div class="form-group">
                        <label for="usernameInput">Username</label>
                        <input id="usernameInput" type="text" placeholder="Username" required>
                    </div>
                    <div class="form-group">
                        <label for="passwordInput">Password</label>
                        <input id="passwordInput" type="password" placeholder="Password" required>
                    </div>
                    <button type="submit" class="btn-primary btn-full-width">Login</button>
                </form>
            </div>
        </div>
    </div>
    <script src="js/utils.js"></script>
    <script src="js/script.js"></script>
</body>

</html>
